services:
  db:
    image: mariadb:latest
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USER}
    volumes:
      - db_data:/var/lib/mysql

  ticket-logger-app:
    build:
      # 'context' es la carpeta que se envia al demonio de Docker para construir la imagen.
      # Aquí usamos la raíz del proyecto (.) donde están el Dockerfile, pom.xml y src/.
      context: .
      # Fichero Dockerfile a usar dentro del contexto anterior.
      # Si se llama literalmente 'Dockerfile', esta línea sería opcional, pero la dejamos por claridad
      dockerfile: Dockerfile
    # Nombre explícito del contenedor. Para luego poder usarlo en los comandos.
    container_name: ticket-logger-app
    environment:
      # Aquí definimos qué variables del .env queremos pasar al contenedor.
      env_file: .env
      # URL JDBC completa hacia el servicio 'db' dentro de la red de Docker.
      DB_URL: ${DB_URL}
      # Credenciales de la base de datos que usará Spring Boot.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Driver JDBC que usará Spring.
      DB_DRIVER: ${DB_DRIVER}
      # Ruta donde la app guardará los ficheros subidos dentro del contenedor.
      # Debe coincidir con lo configurado en application.properties (app.upload-path).
      APP_UPLOAD_PATH: ${APP_UPLOAD_PATH}
      # Puerto interno en el que Spring Boot escucha dentro del contenedor.
      APP_PORT: ${APP_PORT}
    # 'depends_on' indica que este servicio depende del servicio 'db':
    # - Docker levantará primero 'db' y luego 'ticket-logger-app'.
    depends_on:
      - db
    ports:
      - "8080:8080"

    # Volúmenes montados en la app:
    # - 'app_uploads' es un volumen nombrado definido en la sección 'volumes:' al final.
    # - Se monta sobre /app/uploads (la ruta que usamos en el Dockerfile y APP_UPLOAD_PATH).
    # - Con esto, los ficheros que suban los usuarios no se pierden al recrear el contenedor.
    volumes:
      - app_uploads:/app/uploads

  phpmyadmin:
    # Imagen oficial de phpMyAdmin (interfaz web para administrar MySQL/MariaDB)
    image: phpmyadmin:latest
    # Nombre fijo del contenedor (útil para logs y comandos docker)
    container_name: ticket-logger-phpmyadmin
    # Asegura que el contenedor de la BD se arranque antes que phpMyAdmin
    depends_on:
      - db
    environment:
      # Host de la base de datos a la que se conectará phpMyAdmin.
      # "db" es el nombre del servicio MariaDB en este mismo docker-compose,
      # y Docker lo resuelve por DNS dentro de la red interna del compose.
      PMA_HOST: db
      # Puerto interno del servicio MariaDB dentro de la red Docker (por defecto 3306)
      PMA_PORT: 3306
      # Si está a 0, phpMyAdmin NO te deja escribir cualquier host manualmente:
      # solo te conectas al host indicado en PMA_HOST (más seguro en aula).
      # Si lo pones a 1, podrías poner otro servidor MySQL/MariaDB en el login.
      PMA_ARBITRARY: 0
      # Límite máximo para subir ficheros desde la interfaz web (importar .sql, etc.)
      # Útil cuando importas dumps grandes.
      UPLOAD_LIMIT: 128M
    ports:
      # Mapea el puerto 8081 del HOST (tu VM) al puerto 80 del contenedor.
      # Acceso: http://IP_DE_LA_VM:8081
      # Consejo seguridad (alternativas):
      # - "127.0.0.1:8081:80" -> solo accesible desde la propia VM
      # - "192.168.2.41:8081:80" -> solo accesible desde esa IP de la VM
      - "8081:80"


volumes:
  db_data:
  app_uploads:
  certs:

  # Servicio que construye y ejecuta la aplicación Spring Boot (ticket-logger)
